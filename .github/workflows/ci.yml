name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: life
          POSTGRES_PASSWORD: life
          POSTGRES_DB: life_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U life -d life_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm exec vitest run tests/unit tests/integration
        env:
          TEST_DATABASE_URL: postgres://life:life@localhost:5432/life_test
      - run: docker build -f infra/Dockerfile --target api .
      - run: docker build -f infra/Dockerfile --target worker .
      - run: docker build -f infra/Dockerfile --target demo .
