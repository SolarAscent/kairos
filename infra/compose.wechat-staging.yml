# Run from the repository root. See docs/wechat-setup.md.
name: kairos-staging

x-runtime: &runtime
  image: ${KAIROS_IMAGE:?Set KAIROS_IMAGE to a locally built release tag}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kairos_staging
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random hexadecimal database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Deliberately no published database port.
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 128
    shm_size: 128m
    healthcheck:
      test: [CMD-SHELL, pg_isready -U kairos -d kairos_staging]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    <<: *runtime
    restart: "no"
    command: [node, packages/db/dist/migrate.js]
    environment:
      DATABASE_URL: postgres://kairos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/kairos_staging
    mem_limit: 256m
    cpus: 0.25
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *runtime
    command: [node, apps/api/dist/main.js]
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://kairos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/kairos_staging
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT signing secret}
      ACCESS_TOKEN_TTL_SECONDS: "1200"
      REFRESH_TOKEN_TTL_DAYS: "30"
      WECHAT_MOCK_LOGIN: "false"
      WECHAT_APP_ID: ${WECHAT_APP_ID:?Set the mini-program AppID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?Set the server-only AppSecret}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-qwen}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_WORKSPACE_ID: ${DASHSCOPE_WORKSPACE_ID:-}
      QWEN_TEXT_MODEL: ${QWEN_TEXT_MODEL:-qwen3.7-flash-2026-07-15}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-qwen3.7-flash-2026-07-15}
      QWEN_ASR_MODEL: ${QWEN_ASR_MODEL:-qwen3-asr-flash-realtime}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_TEXT_MODEL: ${GLM_TEXT_MODEL:-glm-4.7-flash}
      GLM_VISION_MODEL: ${GLM_VISION_MODEL:-glm-4.6v-flash}
      TENCENT_LBS_KEY: ${TENCENT_LBS_KEY:-}
      TENCENT_LBS_SECRET: ${TENCENT_LBS_SECRET:-}
      NODE_OPTIONS: --max-old-space-size=320
    ports:
      - "127.0.0.1:3100:3000"
    mem_limit: 512m
    cpus: 0.50
    healthcheck:
      test: [CMD-SHELL, wget -q -O - http://127.0.0.1:3000/health/ready >/dev/null]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *runtime
    command: [node, apps/worker/dist/main.js]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://kairos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/kairos_staging
      MODEL_PROVIDER: ${MODEL_PROVIDER:-qwen}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_WORKSPACE_ID: ${DASHSCOPE_WORKSPACE_ID:-}
      QWEN_TEXT_MODEL: ${QWEN_TEXT_MODEL:-qwen3.7-flash-2026-07-15}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-qwen3.7-flash-2026-07-15}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_TEXT_MODEL: ${GLM_TEXT_MODEL:-glm-4.7-flash}
      GLM_VISION_MODEL: ${GLM_VISION_MODEL:-glm-4.6v-flash}
      NODE_OPTIONS: --max-old-space-size=256
      TENCENT_LBS_KEY: ${TENCENT_LBS_KEY:-}
      TENCENT_LBS_SECRET: ${TENCENT_LBS_SECRET:-}
    mem_limit: 384m
    cpus: 0.25
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
